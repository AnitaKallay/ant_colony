name: Build Windows EXE

on: [push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pygame pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --collect-all pygame --name "AntColony" main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AntColony-Windows
          path: dist/AntColony.exe
